name: build-and-test
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore XmlFiscal.sln
      - name: Build
        run: dotnet build XmlFiscal.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test XmlFiscal.sln --configuration Release --no-build --collect:"XPlat Code Coverage"
